version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: newtonite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: newtonite_ops
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: newtonite_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite -d newtonite_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newtonite-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/newtonite_ops
      SPRING_DATASOURCE_USERNAME: newtonite
      SPRING_DATASOURCE_PASSWORD: newtonite_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: newtonite-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
